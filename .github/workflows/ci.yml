name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  # ── Job 2: Build & Push ────────────────────────────────────────────────────
  build:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: lint                        # only runs if lint passes

    permissions:
      contents: read
      packages: write                  # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # tag: latest  (only on main branch pushes)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # tag: short commit SHA  (every build)
            type=sha,prefix=sha-,format=short
            # tag: branch name  (for PRs and feature branches)
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=HR SQLcoder
            org.opencontainers.image.description=Natural-language HR queries → PostgreSQL via Ollama

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}   # push only on main, not PRs
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false                                   # keeps manifest simple for single-arch
