# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name hr.aminraay.ir;
    return 301 https://$host$request_uri;
}

# HTTPS + Basic Auth → Streamlit
server {
    listen 443 ssl;
    server_name hr.aminraay.ir;

    # ── SSL ──────────────────────────────────────────────
    ssl_certificate     /etc/ssl/hr-sqlcoder/fullchain.pem;
    ssl_certificate_key /etc/ssl/hr-sqlcoder/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ─────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # ── Basic Auth ───────────────────────────────────────
    auth_basic           "HR SQLcoder";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    # ── Proxy to Streamlit ───────────────────────────────
    location / {
        proxy_pass         http://hr-sqlcoder:8501;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        proxy_read_timeout 86400;
    }

    # Streamlit static assets
    location /_stcore/stream {
        proxy_pass         http://hr-sqlcoder:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
