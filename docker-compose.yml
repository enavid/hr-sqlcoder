services:

  hr-sqlcoder:
    image: ghcr.io/enavid/hr-sqlcoder:latest
    container_name: hr-sqlcoder
    restart: unless-stopped
    expose:
      - "8501"
    env_file:
      - .env
    volumes:
      - ./schema_context.txt:/app/schema_context.txt:ro
      - ./prompts.json:/app/prompts.json
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: hr-sqlcoder-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/hr-sqlcoder.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/auth:/etc/nginx/auth:ro
      - /etc/ssl/hr-sqlcoder:/etc/ssl/hr-sqlcoder:ro
    depends_on:
      hr-sqlcoder:
        condition: service_healthy
