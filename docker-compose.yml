services:
  hr-sqlcoder:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-user/hr-sqlcoder}:latest
    container_name: hr-sqlcoder
    restart: unless-stopped

    ports:
      - "8501:8501"

    # All secrets come from .env on the server — never baked into the image
    env_file:
      - .env

    # Mount runtime data so it persists across container restarts
    volumes:
      - ./schema_context.txt:/app/schema_context.txt:ro
      - ./prompts.json:/app/prompts.json

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
